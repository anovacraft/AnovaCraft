[package]
name = "stat-script"
description = "Rhai scripting for AnovaCraft: tables, analyses and reports as script values, with a headless runner (anovacraft-run)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "anovacraft-run"
path = "src/bin/anovacraft-run.rs"

[features]
# Database drivers and web access for scripts' external data imports
# (app-model's default features). Off for the WebAssembly check
# (scripts/check-web-build.sh).
default = ["external-data"]
external-data = ["app-model/default"]

[dependencies]
app-model.workspace = true
rhai = { version = "1.26", features = ["metadata"] }
stat-core.workspace = true
stat-data.workspace = true
stat-inference.workspace = true
stat-linear.workspace = true
stat-signal.workspace = true
stat-viz.workspace = true

[dev-dependencies]
rust_xlsxwriter = "0.79"

[lints]
workspace = true
